name: Deploy one environment

# Called once per environment by pipeline.yml. Two jobs:
#
#   Plan    - no GitHub environment, so it runs straight away under the
#             environment's READ-ONLY identity, and publishes the plan to
#             the run summary for the reviewer.
#   Deploy  - runs in the GitHub environment. For uat and production that
#             environment has required reviewers, so the job waits for
#             approval before it can even get an Azure token. It applies
#             the exact saved plan the reviewer read, then deploys the
#             already-built app package.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment and tfvars name (development, uat, production)
        type: string
        required: true
      plan_client_id_var:
        description: Name of the repo variable holding this environment's read-only plan identity
        type: string
        required: true

permissions: {}

env:
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars[inputs.plan_client_id_var] }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate-${{ inputs.environment }}"
      - name: terraform plan
        run: terraform plan -var-file="envs/${{ inputs.environment }}.tfvars" -lock-timeout=5m -out=tfplan
      - name: Publish plan to the run summary
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform plan: ${{ inputs.environment }}"
            echo
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            # A step summary is capped at 1 MiB.
            head -c 900000 plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      # The saved plan is what gets applied. Note: a plan file can contain
      # sensitive attribute values - keep artifact retention short, and in a
      # private repo restrict who can download artifacts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/tfplan
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: plan
    runs-on: ubuntu-latest
    # The approval gate. Required reviewers, wait timers and the "main only"
    # branch rule are settings on this GitHub environment, not in YAML, so
    # nobody can remove them in a pull request.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.app.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      # An environment variable: only readable by jobs that passed the gate.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra
      - name: terraform init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=tfstate-${{ inputs.environment }}"
      # Applies exactly what was reviewed. If anything changed state since
      # the plan (another apply, drift fixed by hand), Terraform refuses the
      # stale plan instead of applying something nobody saw.
      - name: terraform apply (saved plan)
        run: terraform apply -lock-timeout=5m tfplan
      - name: Read outputs
        id: app
        run: |
          echo "name=$(terraform output -raw web_app_name)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw url)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-package
          path: ${{ runner.temp }}/package
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy app package
        run: >
          az webapp deploy
          --resource-group "${{ vars.RESOURCE_GROUP }}"
          --name "${{ steps.app.outputs.name }}"
          --src-path "${{ runner.temp }}/package/app.zip"
          --type zip
          --track-status false
      - name: Smoke test
        env:
          URL: ${{ steps.app.outputs.url }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          # F1 apps cold-start slowly: retry for up to ~5 minutes.
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 20 "$URL/healthz" || true)
            if echo "$body" | grep -q "\"version\":\"$EXPECTED_VERSION\""; then
              echo "Healthy and running $EXPECTED_VERSION: $body"
              exit 0
            fi
            echo "Attempt $i: ${body:-no response}"
            sleep 10
          done
          echo "::error::$URL never reported version $EXPECTED_VERSION"
          exit 1
